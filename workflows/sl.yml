name: SL Engine

on:
  schedule:
    - cron: '15 10 * * 1-5'   # 3:45 PM IST
  workflow_dispatch:

jobs:
  run-sl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: pip install requests pyotp

      - name: Run SL Engine
        run: python Webhook-app/sl_engine.py
