name: SL Engine

on:
  schedule:
    - cron: '15 10 * * 1-5'

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'Webhook-app/**'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  run-sl:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    env:
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
      DHAN_PIN: ${{ secrets.DHAN_PIN }}
      DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # ✅ Ensure DB exists BEFORE scripts
      - name: Prepare DB
        run: |
          mkdir -p Webhook-app
          touch Webhook-app/trades.db

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyotp yfinance pandas

      # ✅ FIXED (separate step)
      - name: Set remote with token
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      # ✅ FIXED (separate step)
      - name: Debug env
        run: |
          echo "TOTP present: $([[ -n \"$DHAN_TOTP_SECRET\" ]] && echo YES || echo NO)"
          echo "PIN present: $([[ -n \"$DHAN_PIN\" ]] && echo YES || echo NO)"

      - name: Run SL Engine
        run: python Webhook-app/sl_engine.py

      - name: Commit DB
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"

          git pull origin main --rebase || true

          git add Webhook-app/trades.db
          git commit -m "update trades db" || echo "no changes"
          git push
