name: SL Engine

on:
  schedule:
    - cron: '15 10 * * 1-5'

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'Webhook-app/**'
      - '.github/workflows/**'

jobs:
  run-sl:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    env:
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
      DHAN_PIN: ${{ secrets.DHAN_PIN }}
      DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyotp yfinance

      - name: Debug env (safe)
        run: |
          echo "TOTP present: $([[ -n \"$DHAN_TOTP_SECRET\" ]] && echo YES || echo NO)"
          echo "PIN present: $([[ -n \"$DHAN_PIN\" ]] && echo YES || echo NO)"

      - name: Run SL Engine
        run: python Webhook-app/sl_engine.py
