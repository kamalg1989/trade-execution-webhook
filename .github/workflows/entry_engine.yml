name: Entry Engine

on:
  repository_dispatch:
    types: [trade_entry]

permissions:
  contents: write

jobs:
  run-entry:
    runs-on: ubuntu-latest

    env:
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
      DHAN_PIN: ${{ secrets.DHAN_PIN }}
      DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}


      SYMBOL: ${{ github.event.client_payload.symbol }}
      QTY: ${{ github.event.client_payload.qty }}
      ENTRY: ${{ github.event.client_payload.entry }}
      SL: ${{ github.event.client_payload.sl }}
      TARGET: ${{ github.event.client_payload.target }}
      SCORE: ${{ github.event.client_payload.score }}
      SETUP_ID: ${{ github.event.client_payload.setup_id }}

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Prepare DB (use repo DB)
        run: |
          mkdir -p Webhook-app
          if [ -f trades.db ]; then
            cp trades.db Webhook-app/trades.db
          else
            touch Webhook-app/trades.db
          fi

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyotp pandas

      - name: Sync time
        run: |
          sudo apt-get update
          sudo apt-get install -y ntpdate
          sudo ntpdate time.google.com || true

      - name: Debug env
        run: |
          echo "SYMBOL=$SYMBOL"
          echo "QTY=$QTY"
          echo "ENTRY=$ENTRY"
          echo "EXIT=$EXIT"
          echo "TOTP present: $([[ -n \"$DHAN_TOTP_SECRET\" ]] && echo YES || echo NO)"

      - name: Run Entry Engine
        run: python Webhook-app/entry_engine.py

      - name: Set remote
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git pull origin main --rebase || true

      - name: Commit DB
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"

          git pull origin main --rebase || true

          cp Webhook-app/trades.db trades.db
          git add trades.db
          git diff --cached --quiet || git commit -m "entry added"
          git push
