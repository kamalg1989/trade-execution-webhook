# Nginx configuration for Market Data API
# Add this to your existing /etc/nginx/sites-available/default
# Or create new site: /etc/nginx/sites-available/market-data-api
#
# Installation:
#   1. Copy to /etc/nginx/sites-available/
#   2. sudo ln -s /etc/nginx/sites-available/market-data-api /etc/nginx/sites-enabled/
#   3. sudo nginx -t
#   4. sudo systemctl reload nginx

# Upstream FastAPI servers
upstream market_data_api {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Cache zone definition (10 MB, 1:2 levels)
proxy_cache_path /var/cache/nginx/market_data \
    levels=1:2 \
    keys_zone=market_data_cache:10m \
    max_size=500m \
    inactive=60m \
    use_temp_path=off;

# Server block
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Client request limits
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Compression
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1000;
    gzip_vary on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ================================================================
    # API ENDPOINTS - Market Data
    # ================================================================

    # Health check (no cache)
    location /api/v1/health {
        proxy_pass http://market_data_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # OHLCV endpoint (cache 2 hours)
    location /api/v1/ohlcv {
        proxy_pass http://market_data_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache configuration
        proxy_cache market_data_cache;
        proxy_cache_valid 200 2h;
        proxy_cache_valid 404 5m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Cache-Key $proxy_cache_key always;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Charts endpoint (cache 1 hour)
    location /api/v1/charts {
        proxy_pass http://market_data_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache SVG responses
        proxy_cache market_data_cache;
        proxy_cache_valid 200 1h;
        proxy_cache_valid 404 5m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;

        # Timeouts (chart generation can take longer)
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Indicators endpoint (cache 30 minutes)
    location /api/v1/indicators {
        proxy_pass http://market_data_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache configuration
        proxy_cache market_data_cache;
        proxy_cache_valid 200 30m;
        proxy_cache_valid 404 5m;
        add_header X-Cache-Status $upstream_cache_status always;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Symbols endpoint (cache 24 hours)
    location /api/v1/symbols {
        proxy_pass http://market_data_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache
        proxy_cache market_data_cache;
        proxy_cache_valid 200 24h;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # API documentation
    location /api/v1/docs {
        proxy_pass http://market_data_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Root endpoint
    location /api/v1 {
        proxy_pass http://market_data_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ================================================================
    # EXISTING ENDPOINTS - Telegram Webhook
    # ================================================================

    location /webhook/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ================================================================
    # CACHE STATISTICS & STATUS
    # ================================================================

    # Cache stats (restricted access)
    location /cache_status {
        access_log off;
        proxy_cache_bypass $http_pragma $http_authorization;
        add_header Cache-Status $upstream_cache_status;
        add_header X-Cache-Key $proxy_cache_key;
        return 200 "Cache stats endpoint";
    }

    # ================================================================
    # DEFAULT / STATIC
    # ================================================================

    location / {
        return 404;
    }
}

