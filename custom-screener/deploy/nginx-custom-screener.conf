# Custom Screener — dedicated path on the existing domain.
# Paste these two location blocks INSIDE the existing HTTPS server { } block
# for ohmstockvault.duckdns.org (the one certbot manages). No new server block,
# no DNS change, reuses the existing certificate.

# 1) Static SPA build. Vite base is /custom-screener/, so assets resolve correctly.
location /custom-screener/ {
    alias /root/web-app-custom-screener/;   # <- deploy dist/ contents here
    try_files $uri $uri/ /custom-screener/index.html;
}

# 2) API -> FastAPI on :8005. Trailing slash on proxy_pass strips the
#    /custom-screener/api/ prefix so the backend sees /api/... .
location /custom-screener/api/ {
    proxy_pass http://127.0.0.1:8005/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Note: /api/v1/ (charts) is already proxied by the existing config to :8001,
# so the chart modal works without any extra block.
