# =============================================================================
# LIVE production nginx config captured from the VPS:
#   /etc/nginx/sites-enabled/trade-platform
# This is the full server block for ohmstockvault.duckdns.org (all services),
# committed for reference/reproducibility. The custom-screener blocks are the
# two `^~ /custom-screener*` locations. Nothing secret here (cert paths are the
# standard Let's Encrypt locations; the private key itself is NOT in this file).
#
# To restore: copy to /etc/nginx/sites-enabled/trade-platform, then
#   nginx -t && systemctl reload nginx
# =============================================================================
server {
    server_name ohmstockvault.duckdns.org;

    root /root/web-app/dist;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Custom Screener (standalone app, :8005) ---
    location ^~ /custom-screener/api/ {
        proxy_pass http://127.0.0.1:8005/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /custom-screener/ {
        try_files $uri $uri/ /custom-screener/index.html;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # MCP server (Streamable HTTP) for Claude Desktop / Web connectors
    location /mcp {
        proxy_pass http://127.0.0.1:8003/mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Market Data API (charts, ohlcv, swagger docs)
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Trade Web API
    location /api/ {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ohmstockvault.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ohmstockvault.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = ohmstockvault.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name ohmstockvault.duckdns.org;
    return 404; # managed by Certbot
}
