    # ---- OHM Screener web (CAN SLIM + OHM) - 2026-11-22 ----------------------
    # Read-only. Static page in /root/web-app/dist/ohm-screener/, API on 8008.
    location ^~ /ohm-screener/api/ {
        proxy_pass http://127.0.0.1:8008/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location = /ohm-screener { return 301 /ohm-screener/; }
    location ^~ /ohm-screener/ {
        try_files $uri $uri/ /ohm-screener/index.html;
        add_header Cache-Control "no-cache";
    }
    # ---- OHM full setup (/ohm/) - 2026-11-23 ----------------------------------
    location ^~ /ohm/api/ {
        proxy_pass http://127.0.0.1:8009/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location = /ohm { return 301 /ohm/; }
    location ^~ /ohm/ {
        try_files $uri $uri/ /ohm/index.html;
        add_header Cache-Control "no-cache";
    }
