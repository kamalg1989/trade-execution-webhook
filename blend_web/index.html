<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OHM · A5 + OHM Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#07090D;--card:#0E1218;--line:rgba(255,255,255,.07);--soft:rgba(255,255,255,.05);--tx:#ECEFF3;--mu:#8D96A3;--gold:#C9B07A;--gold2:#E2C98F;--up:#7FD3AE;--dn:#FF8A7A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Geist',system-ui,sans-serif;font-feature-settings:'tnum' 1;-webkit-font-smoothing:antialiased}
a{color:#9FD9C0}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.serif{font-family:'Instrument Serif',serif;font-weight:400}
.wrap{max-width:1320px;margin:0 auto;padding:0 32px}
header{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(7,9,13,.92);backdrop-filter:blur(10px);z-index:5}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:20px;padding:16px 32px;max-width:1320px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px}
.brand b{font-size:15px;font-weight:600;letter-spacing:.14em}
.sep{width:1px;height:16px;background:rgba(255,255,255,.12)}
.seg{margin-left:auto;display:flex;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.seg button{min-height:40px;padding:0 20px;border:0;border-radius:999px;font:500 14px 'Geist',sans-serif;cursor:pointer;background:transparent;color:#B8C0CB;transition:background .2s,color .2s}
.seg button[aria-pressed=true]{background:var(--tx);color:var(--bg)}
.stamp{display:flex;align-items:center;gap:8px;font:400 12px 'Geist Mono',monospace;color:var(--mu)}
.stamp i{width:6px;height:6px;border-radius:50%;background:var(--mu)}
main{display:flex;flex-direction:column;gap:20px;padding-top:32px;padding-bottom:80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 26px;min-width:0}
.card h2{margin:0;font-size:15px;font-weight:600}
.ch{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:16px}
.sub{font-size:12px;color:var(--mu)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.hero{background:linear-gradient(180deg,#10141B,#0C1016);border:1px solid var(--line);border-radius:24px;padding:32px 36px;display:grid;grid-template-columns:minmax(280px,1fr) 2fr;gap:36px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.big{font-size:76px;line-height:1;margin-top:10px;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;font:500 12px 'Geist Mono',monospace;border:1px solid var(--soft);background:rgba(255,255,255,.04)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px;padding-top:18px;margin-top:24px;border-top:1px solid var(--soft)}
.stats div div:last-child{font:500 20px 'Geist Mono',monospace;margin-top:4px}
.tile2{background:rgba(255,255,255,.03);border:1px solid var(--soft);border-radius:12px;padding:12px 14px}
.row{display:flex;align-items:center;gap:10px;font-size:14px}
.tl{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:10px 0;border-top:1px solid var(--soft)}
.map{display:flex;flex-wrap:wrap;gap:4px}
.map div{border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;color:#F3F5F7;border:1px solid var(--soft)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
th{color:var(--mu);font-size:12px;font-weight:500;padding:12px 10px;text-align:right}
td{padding:13px 10px;text-align:right;border-top:1px solid var(--soft);font:400 13px 'Geist Mono',monospace}
th.l,td.l{text-align:left}
td.s{font:500 14px 'Geist',sans-serif}
.act{display:grid;grid-template-columns:14px 1fr auto;gap:14px;align-items:start;padding-bottom:16px}
.dot{width:9px;height:9px;border-radius:50%;margin-top:5px}
.hl{display:flex;align-items:center;gap:12px;min-height:44px;border-top:1px solid var(--soft);font-size:14px}
.empty{border:1px dashed rgba(255,255,255,.1);border-radius:14px;padding:36px;text-align:center;font-size:14px;color:var(--mu)}
#gate{max-width:420px;margin:120px auto;padding:32px;background:var(--card);border:1px solid var(--line);border-radius:20px}
#gate input{width:100%;min-height:44px;margin:12px 0;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#07090D;color:var(--tx);font:14px 'Geist Mono',monospace}
#gate button{min-height:44px;padding:0 20px;border:0;border-radius:999px;background:var(--tx);color:var(--bg);font:500 14px Geist,sans-serif;cursor:pointer}
@media (max-width:900px){.hero{grid-template-columns:1fr;padding:24px}.big{font-size:56px}.wrap,.hd{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<header><div class="hd">
<div class="brand"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12.5" fill="none" stroke="#C9B07A" stroke-width="1.5"/><path d="M7 17.5 L11.5 12 L15 15 L21 8.5" fill="none" stroke="#C9B07A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><b>OHM</b><span class="sep"></span><span class="sub" style="font-size:13px">A5 + OHM Pro</span></div>
<div class="seg" role="group" aria-label="Show book" id="seg"></div>
<div class="stamp" id="stamp"><i></i>loading</div>
</div></header>
<div id="gate" hidden>
<h2 style="margin:0;font-size:18px">Dashboard key</h2>
<p class="sub" style="font-size:14px;margin:8px 0 0">The same key as the other OHM pages. Saved in this browser.</p>
<label for="k" class="sub">API key</label>
<input id="k" type="password" autocomplete="off">
<button id="kgo" type="button">Open</button>
<p id="kerr" style="color:var(--dn);font-size:13px"></p>
</div>
<main class="wrap" id="app" hidden></main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr = x => x == null ? '—' : '₹' + Math.round(x).toLocaleString('en-IN');
const lakh = x => x == null ? '—' : '₹' + (x / 1e5).toFixed(2) + 'L';
const pct = p => p == null ? '—' : (p >= 0 ? '+' : '−') + Math.abs(p).toFixed(1) + '%';
const C = {gold:'#C9B07A', gold2:'#E2C98F', up:'#7FD3AE', dn:'#FF8A7A', mu:'#8D96A3', tx:'#ECEFF3'};
const fdate = s => { if (!s) return ''; const d = new Date(s.length <= 10 ? s + 'T00:00:00' : s); return d.toLocaleDateString('en-IN', {day:'2-digit', month:'short'}); };
const ftime = s => { if (!s) return ''; const d = new Date(s); return d.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit', hour12:false}); };
const chip = (t, c, bg) => `<span class="chip" style="color:${c};background:${bg}">${esc(t)}</span>`;
let D = null, view = (() => { try { return localStorage.getItem('blendView') || 'Combined'; } catch (e) { return 'Combined'; } })();

function key() { try { return localStorage.getItem('trading_api_key') || ''; } catch (e) { return ''; } }
async function load() {
  const k = key();
  if (!k) { $('gate').hidden = false; return; }
  const r = await fetch('/blend/api/data', {headers: {'X-API-Key': k}, cache: 'no-store'});
  if (r.status === 401) { $('gate').hidden = false; $('app').hidden = true; $('kerr').textContent = 'That key did not work.'; return; }
  if (!r.ok) { $('stamp').innerHTML = '<i style="background:#FF8A7A"></i>data not available'; return; }
  D = await r.json(); $('gate').hidden = true; $('app').hidden = false; render();
}
$('kgo').onclick = () => { try { localStorage.setItem('trading_api_key', $('k').value.trim()); } catch (e) {} load(); };
$('k').addEventListener('keydown', e => { if (e.key === 'Enter') $('kgo').click(); });

function seg() {
  $('seg').innerHTML = ['Combined', 'A5', 'OHM Pro'].map(k => `<button type="button" aria-pressed="${view === k}" data-v="${k}">${k}</button>`).join('');
  $('seg').querySelectorAll('button').forEach(b => b.onclick = () => { view = b.dataset.v; try { localStorage.setItem('blendView', view); } catch (e) {} render(); });
}

function chart(curve, label) {
  if (!curve || curve.length < 2) return `<div class="empty" style="margin-top:12px">${esc(label)}: the chart starts after the second day.</div>`;
  const E = curve.map(c => c[1]), n = E.length;
  let lo = Math.min(...E), hi = Math.max(...E); const pad = Math.max((hi - lo) * .12, hi * .004); lo -= pad; hi += pad;
  const X = i => i * 720 / (n - 1), Y = e => 14 + (hi - e) / (hi - lo) * 186;
  const pts = E.map((e, i) => [X(i), Y(e)]), P = pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  let pk = -1, pki = 0; const dd = E.map((e, i) => { if (e > pk) { pk = e; pki = i; } return (e / pk - 1) * 100; });
  const ddLo = Math.min(-1, Math.floor(Math.min(...dd)));
  const DY = d => 236 + d / ddLo * 44, DP = dd.map((d, i) => X(i).toFixed(1) + ',' + DY(d).toFixed(1)).join(' ');
  const grid = [hi, (hi + lo) / 2, lo].map(g => `<line x1="0" x2="800" y1="${Y(g)}" y2="${Y(g)}" stroke="rgba(255,255,255,.05)"/><text x="800" y="${Y(g) - 4}" text-anchor="end" fill="#6E7784" font-size="11" font-family="Geist Mono">${(g / 1e5).toFixed(2)}L</text>`).join('');
  const [px, py] = pts[pki], [lx, ly] = pts[n - 1], mid = curve[Math.floor((n - 1) / 2)][0];
  const minDD = Math.min(...dd);
  return `<div style="display:flex;justify-content:space-between;font-size:12px;color:${C.mu};margin-bottom:8px"><span>${esc(label)}</span><span class="mono">${fdate(curve[0][0])} → ${fdate(curve[n - 1][0])}</span></div>
<svg viewBox="0 0 800 300" role="img" aria-label="${esc(label)}: ${lakh(E[0])} to ${lakh(E[n - 1])}, peak ${lakh(pk)}, deepest drawdown ${Math.abs(minDD).toFixed(1)}%" style="width:100%;height:auto;display:block">
<defs><linearGradient id="eqf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9B07A" stop-opacity=".28"/><stop offset="1" stop-color="#C9B07A" stop-opacity="0"/></linearGradient>
<linearGradient id="ddf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8A7A" stop-opacity=".05"/><stop offset="1" stop-color="#FF8A7A" stop-opacity=".45"/></linearGradient></defs>
${grid}<polygon points="0,206 ${P} 720,206" fill="url(#eqf)"/><polyline points="${P}" fill="none" stroke="#C9B07A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="${px}" x2="${px}" y1="${py}" y2="206" stroke="rgba(201,176,122,.35)" stroke-dasharray="2 4"/><circle cx="${px}" cy="${py}" r="4" fill="#07090D" stroke="#C9B07A" stroke-width="1.5"/>
<text x="${Math.min(px + 10, 640)}" y="${py + 4}" fill="#C9B07A" font-size="11" font-family="Geist Mono">peak ${inr(pk)}</text>
<circle cx="${lx}" cy="${ly}" r="10" fill="#C9B07A" fill-opacity=".15"/><circle cx="${lx}" cy="${ly}" r="5" fill="#C9B07A"/>
<text x="0" y="226" fill="#6E7784" font-size="11" font-family="Geist">Drawdown</text><line x1="0" x2="800" y1="236" y2="236" stroke="rgba(255,255,255,.08)"/>
<polygon points="0,236 ${DP} 720,236" fill="url(#ddf)"/><polyline points="${DP}" fill="none" stroke="#FF8A7A" stroke-width="1.2" stroke-opacity=".8"/>
<text x="800" y="290" text-anchor="end" fill="#6E7784" font-size="11" font-family="Geist Mono">${ddLo}%</text>
<text x="0" y="300" fill="#6E7784" font-size="11" font-family="Geist Mono">${fdate(curve[0][0])}</text><text x="400" y="300" text-anchor="middle" fill="#6E7784" font-size="11" font-family="Geist Mono">${fdate(mid)}</text><text x="720" y="300" text-anchor="end" fill="#6E7784" font-size="11" font-family="Geist Mono">${fdate(curve[n - 1][0])}</text></svg>`;
}

function gauge(b, need) {
  const P = f => [120 - 100 * Math.cos(Math.PI * f), 120 - 100 * Math.sin(Math.PI * f)];
  const [gx, gy] = P(Math.max(.005, Math.min(.995, b / 100))), a = Math.PI * need / 100, c = Math.cos(a), s = Math.sin(a);
  return `<svg viewBox="0 0 240 140" role="img" aria-label="Breadth ${b}%, OHM Pro buys need ${need}%" style="width:100%;max-width:300px;align-self:center;height:auto">
<path d="M 20 120 A 100 100 0 0 1 220 120" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="14" stroke-linecap="round"/>
<path d="M 20 120 A 100 100 0 0 1 ${gx.toFixed(1)} ${gy.toFixed(1)}" fill="none" stroke="#C9B07A" stroke-width="14" stroke-linecap="round"/>
<line x1="${120 - 88 * c}" y1="${120 - 88 * s}" x2="${120 - 112 * c}" y2="${120 - 112 * s}" stroke="#ECEFF3" stroke-width="2"/>
<text x="${120 - 126 * c}" y="${120 - 126 * s + 3}" fill="#8D96A3" font-size="10" font-family="Geist Mono" text-anchor="middle">${need}</text>
<text x="120" y="104" text-anchor="middle" fill="#ECEFF3" font-size="34" font-family="Instrument Serif">${b}%</text></svg>`;
}

function heat(p) {
  const t = Math.max(-1, Math.min(1, (p || 0) / 10)), base = [26, 31, 39], to = t >= 0 ? [31, 107, 78] : [122, 42, 37], k = Math.abs(t);
  return 'rgb(' + base.map((x, i) => Math.round(x + (to[i] - x) * k)).join(',') + ')';
}

function render() {
  seg();
  const A = D.a5, O = D.ohm, ohm = view === 'OHM Pro', a5only = view === 'A5';
  const gen = new Date(D.generated), age = (Date.now() - gen) / 60000;
  $('stamp').innerHTML = `<i style="background:${age > 30 ? C.dn : C.up}"></i>updated ${ftime(D.generated)} · ${fdate(D.generated)}`;
  const ohmLive = O.mode === 'LIVE' ? (O.eq || 0) : 0;
  const total = (A.total || 0) + ohmLive;
  const a5cash = A.tranches.reduce((s, t) => s + t.cash, 0), a5inv = (A.total || 0) - a5cash;
  const nA = A.positions.length, nO = O.positions.length;
  const c0 = A.curve.length ? A.curve[0][1] : null, sinceRet = c0 ? (A.total / c0 - 1) * 100 : null;
  const ddO = O.peak ? (O.eq / O.peak - 1) * 100 : 0;

  // ---- hero
  let H;
  if (ohm) H = {l: 'OHM Pro book · ' + (O.mode === 'LIVE' ? 'live' : 'shadow, no real orders'), v: inr(O.eq),
    chips: chip(O.mode, C.gold2, 'rgba(226,201,143,.08)') + chip(nO + ' / ' + O.maxPos + ' positions', C.tx, 'rgba(255,255,255,.04)') + chip('drawdown ' + pct(ddO), ddO < -1 ? C.dn : C.mu, 'rgba(255,255,255,.04)'),
    stats: [['Cash', inr(O.cash), C.tx], ['In LIQUIDCASE', O.liqQty ? inr(O.liqQty * (O.liqLast || 0)) : '₹0', C.tx], ['Closed trades', O.closed, C.tx], ['New buys stop at', '−25% DD', C.mu]],
    curve: O.curve, cl: 'OHM Pro equity'};
  else H = {l: a5only ? 'A5 equity · 3 tranches' : 'Total equity · both books', v: inr(a5only ? A.total : total),
    chips: chip(pct(sinceRet) + ' since ' + fdate(A.curve[0] && A.curve[0][0]), sinceRet >= 0 ? C.up : C.dn, sinceRet >= 0 ? 'rgba(127,211,174,.08)' : 'rgba(255,138,122,.08)') + chip('drawdown ' + pct(A.dd), C.gold2, 'rgba(226,201,143,.08)') + chip((a5only ? nA : nA + nO) + ' positions', C.tx, 'rgba(255,255,255,.04)') + (A.halted ? chip('A5 HALTED', C.dn, 'rgba(255,138,122,.12)') : ''),
    stats: a5only ? [['Cash', inr(a5cash), C.tx], ['Invested', inr(a5inv), C.tx], ['Peak', inr(A.peak), C.tx], ['Kill switch −25%', inr(A.kill), C.mu]]
                  : [['A5 live', lakh(A.total), C.tx], ['OHM Pro live', O.mode === 'LIVE' ? lakh(O.eq) : '₹0 · shadow', O.mode === 'LIVE' ? C.tx : C.mu], ['Peak', inr(A.peak), C.tx], ['Kill switch', inr(A.kill), C.mu]],
    curve: A.curve, cl: 'A5 equity and drawdown'};
  let h = `<section class="hero"><div><div class="sub" style="font-size:13px">${esc(H.l)}</div><div class="serif big">${H.v}</div><div class="chips">${H.chips}</div>
<div class="stats">${H.stats.map(s => `<div><div class="sub">${esc(s[0])}</div><div style="color:${s[2]}">${esc(s[1])}</div></div>`).join('')}</div></div>
<div style="min-width:0">${chart(H.curve, H.cl)}</div></section>`;

  // ---- regime / capital / coming up
  const b = O.breadth, bA = A.breadth;
  const regime = `<div class="card" style="display:flex;flex-direction:column;gap:16px"><div class="ch" style="margin:0"><h2>Market regime</h2><span class="sub">liquid stocks above 200-day</span></div>
${b != null ? gauge(b, 60) : ''}<div style="text-align:center;font-size:11px;letter-spacing:1.5px;color:${C.mu};margin-top:-12px">${esc(O.phase || '')}</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div class="tile2"><div class="sub">A5 new buys</div><div class="mono" style="font-size:16px;margin-top:4px;color:${C.gold2}">${bA ? Math.round(bA.a5_exposure * 100) + '% size' : '—'}</div><div class="sub" style="margin-top:2px">${bA ? 'breadth ' + bA.a5_breadth200 + '% · band ' + bA.a5_band.join('–') : ''}</div></div>
<div class="tile2"><div class="sub">OHM Pro buys</div><div class="mono" style="font-size:16px;margin-top:4px;color:${O.buysOn ? C.up : C.dn}">${O.buysOn ? 'On' : 'Off · needs 60%'}</div><div class="sub" style="margin-top:2px">JUNIORBEES ${O.jrOn ? 'above' : 'below'} 50-day</div></div></div></div>`;
  const alloc = [['A5 invested', a5inv, C.gold], ['A5 cash', a5cash, '#6B5B3B'], ['OHM Pro', ohmLive, C.up]];
  const at = alloc.reduce((s, a) => s + a[1], 0) || 1;
  const capital = `<div class="card" style="display:flex;flex-direction:column;gap:16px"><div class="ch" style="margin:0"><h2>Capital</h2><span class="sub">live money by book</span></div>
<div><div style="display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px">${alloc.filter(a => a[1] > 0).map(a => `<span style="flex:${a[1]} 0 0;background:${a[2]}"></span>`).join('')}</div>
<div style="position:relative;height:24px"><span style="position:absolute;left:70%;top:2px;width:1px;height:10px;background:${C.tx}"></span><span class="mono" style="position:absolute;left:70%;top:11px;transform:translateX(-50%);font-size:10px;color:${C.mu}">target 70/30</span></div></div>
${alloc.map(a => `<div class="row"><span style="width:8px;height:8px;border-radius:2px;background:${a[2]}"></span><span style="flex:1">${a[0]}</span><span class="mono">${lakh(a[1])}</span><span class="mono" style="width:56px;text-align:right;color:${C.mu}">${(a[1] / at * 100).toFixed(1)}%</span></div>`).join('')}
<div class="sub" style="margin-top:auto;line-height:1.5">${O.mode === 'LIVE' ? 'OHM Pro is live.' : 'OHM Pro runs ' + inr(O.eq) + ' in shadow. Real money starts after about two weeks.'}</div></div>`;
  const up = A.tranches.map(t => ({toGo: t.toGo, x: 'A5 T' + t.n + ' rebalance', s: t.toGo <= 0 ? 'due now' : t.toGo === 21 || t.since === 0 ? 'orders at the next open' : 'in ' + t.toGo + ' sessions'}))
    .sort((a, b) => (a.s.startsWith('orders') ? -1 : a.toGo) - (b.s.startsWith('orders') ? -1 : b.toGo));
  const coming = [...up.map(u => ({t: u.s.startsWith('orders') ? '09:15' : u.toGo <= 0 ? 'now' : '+' + u.toGo + 'd', c: u.s.startsWith('orders') ? C.gold2 : C.mu, x: u.x, s: u.s})),
    {t: '19:30', c: C.mu, x: 'OHM Pro scan', s: O.buysOn ? 'buys are on' : 'buys turn on at 60% breadth'},
    {t: '22:50', c: C.mu, x: 'OHM Pro plan', s: O.mode + ' · last plan ' + fdate(O.plan.date) + ', ' + O.plan.items + ' item(s)'}];
  const next = `<div class="card"><div class="ch"><h2>Coming up</h2><span class="sub">all automatic</span></div>
${coming.map(n => `<div class="tl"><div class="mono" style="font-size:12px;color:${n.c};padding-top:2px">${esc(n.t)}</div><div><div style="font-size:14px;font-weight:500">${esc(n.x)}</div><div class="sub" style="margin-top:3px">${esc(n.s)}</div></div></div>`).join('')}</div>`;
  h += `<section class="grid3">${regime}${capital}${next}</section>`;

  // ---- tranches (A5 views) / executor (OHM)
  if (!ohm) h += `<section class="grid3">${A.tranches.map(t => {
    const day = Math.min(21, Math.max(0, t.since ?? 0)), r = t.ret;
    return `<div class="card" style="display:flex;flex-direction:column;gap:14px;padding:22px 24px">
<div class="row"><span class="mono" style="font-size:12px;padding:4px 9px;border-radius:7px;border:1px solid rgba(201,176,122,.35);color:${C.gold2}">T${t.n}</span><span class="sub" style="font-size:13px">${t.nOpen} stocks · vol × ${t.vm ?? '—'}</span><span class="mono" style="margin-left:auto;color:${r >= 0 ? C.up : C.dn}">${pct(r)}</span></div>
<div class="serif" style="font-size:34px;line-height:1">${inr(t.eq)}</div>
<div><div class="sub" style="display:flex;justify-content:space-between;margin-bottom:6px"><span>cycle day ${day} of ${t.need || 21}</span><span>${t.since === 0 ? 'rebalanced · orders out' : 'next in ' + t.toGo + ' sessions'}</span></div>
<div style="height:4px;background:rgba(255,255,255,.07);border-radius:2px"><div style="height:4px;border-radius:2px;width:${(t.since === 0 ? 100 : day / (t.need || 21) * 100).toFixed(0)}%;background:${t.since === 0 ? C.gold2 : 'rgba(201,176,122,.55)'}"></div></div></div>
<div class="sub">cash <span class="mono" style="color:${C.tx}">${inr(t.cash)}</span></div></div>`; }).join('')}</section>`;
  else h += `<section class="card"><div class="ch"><h2>Executor</h2><span class="mono" style="font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(226,201,143,.1);color:${C.gold2}">${esc(O.mode)}</span></div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px">${[['Plan', '22:50 after the scan'], ['Send orders', '08:50 · exits at market on the open'], ['Buys', 'forever limit, trigger × 1.002'], ['Cash guard', 'every 10 min · never uses A5 money'], ['Idle cash', 'LIQUIDCASE when buys are off'], ['Last plan', fdate(O.plan.date) + ' · ' + O.plan.items + ' item(s)' + (O.plan.fired ? ' · sent' : '')]]
    .map(e => `<div class="tile2"><div class="sub">${e[0]}</div><div style="font-size:14px;font-weight:500;margin-top:5px">${esc(e[1])}</div></div>`).join('')}</div></section>`;

  // ---- positions map + table
  const rows = (ohm ? O.positions.map(p => ({...p, book: 'OHM Pro'})) : view === 'A5' ? A.positions.map(p => ({...p, book: 'A5 T' + p.t}))
    : A.positions.map(p => ({...p, book: 'A5 T' + p.t})).concat(O.positions.map(p => ({...p, book: 'OHM Pro'})))).filter(r => r.val).sort((a, b) => b.val - a.val);
  const vmax = rows.length ? rows[0].val : 1;
  h += `<section class="card"><div class="ch"><h2>Positions</h2><span class="sub" style="margin-right:auto">${rows.length} · sized by value, coloured by profit</span>
<span class="mono" style="display:flex;align-items:center;gap:8px;font-size:11px;color:${C.mu}">−10%<span style="width:120px;height:6px;border-radius:3px;background:linear-gradient(90deg,#7A2A25,#1A1F27,#1F6B4E)"></span>+10%</span></div>
${rows.length ? `<div class="map">${rows.map(r => { const k = r.val / vmax; return `<div title="${esc(r.sym)} · ${esc(r.book)} · ${inr(r.val)}" style="flex:${(k * 10 + 1).toFixed(2)} 1 ${Math.round(88 + k * 150)}px;min-height:${Math.round(70 + k * 40)}px;background:${heat(r.pnl)}"><div style="font-size:12px;font-weight:600">${esc(r.sym)}</div><div class="mono" style="font-size:14px;margin-top:2px">${pct(r.pnl)}</div><div class="mono" style="font-size:11px;opacity:.7;margin-top:auto">₹${(r.val / 1000).toFixed(1)}k</div></div>`; }).join('')}</div>`
  : `<div class="empty">No ${ohm ? 'OHM Pro ' : ''}positions yet. Each buy appears here as a tile.</div>`}</section>`;
  if (rows.length) h += `<section class="card"><div class="ch"><h2>Holdings</h2><span class="sub" style="margin-right:auto">largest first</span></div><div style="overflow-x:auto"><table>
<thead><tr><th class="l" scope="col">Stock</th><th class="l" scope="col">Book</th><th scope="col">Qty</th><th scope="col">Avg</th><th scope="col">Last</th><th scope="col">Value</th><th scope="col">P&amp;L</th><th class="l" scope="col" style="padding-left:24px">Since</th></tr></thead><tbody>
${rows.map(r => `<tr><td class="l s">${esc(r.sym)}</td><td class="l" style="color:${C.mu}">${esc(r.book)}</td><td>${r.qty}</td><td style="color:${C.mu}">${(r.avg ?? 0).toLocaleString('en-IN')}</td><td>${(r.last ?? 0).toLocaleString('en-IN')}</td><td>${inr(r.val)}</td><td style="color:${r.pnl >= 0 ? C.up : C.dn}">${pct(r.pnl)}</td><td class="l" style="padding-left:24px;color:${C.mu}">${fdate(r.since)}${r.stop ? ' · stop ' + r.stop : ''}</td></tr>`).join('')}
</tbody></table></div></section>`;

  // ---- activity + health
  const aA = A.events.map(e => ({at: e.at, b: 'A5' + (e.t ? ' T' + e.t : '') + ' · ' + fdate(e.at), x: e.kind.replace(/_/g, ' ').toLowerCase() + (e.detail ? ' — ' + e.detail : ''), c: /HALT|ORPHAN|DRIFT|REFUSED|ERROR/.test(e.kind) ? C.dn : C.gold}));
  const aO = O.acts.map(e => ({at: e.at, b: 'OHM Pro · ' + fdate(e.at), x: (e.kind === 'shadow_fill' ? 'shadow ' : '') + (e.act || e.kind).toString().toLowerCase() + ' ' + (e.sym || '') + ' ' + (e.qty || '') + (e.px ? ' @ ' + e.px : ''), c: C.up}));
  const acts = (ohm ? aO : a5only ? aA : aA.concat(aO)).sort((a, b) => (b.at > a.at ? 1 : -1)).slice(0, 8);
  const ok = (k, v, good) => ({k, v, c: good ? C.up : C.dn});
  const HL = [];
  if (!ohm) HL.push(ok('A5 halt', A.halted ? 'HALTED' : 'clear', !A.halted), ok('A5 drawdown', pct(A.dd) + ' (alert −20%)', (A.dd ?? 0) > -20));
  if (!a5only) HL.push(ok('OHM Pro halt', O.halted ? 'HALTED' : 'clear', !O.halted), ok('OHM Pro scan', 'as of ' + fdate(O.asof), true));
  HL.push(ok('Dashboard data', age > 30 ? Math.round(age) + ' min old' : 'fresh', age <= 30));
  if (D.errors && Object.keys(D.errors).length) HL.push(ok('Data errors', Object.keys(D.errors).join(', '), false));
  const bad = HL.filter(x => x.c !== C.up).length;
  h += `<section class="grid3"><div class="card" style="grid-column:span 2"><div class="ch"><h2>Activity</h2><span class="sub">latest first</span></div>
${acts.length ? acts.map(a => `<div class="act"><span class="dot" style="background:${a.c};box-shadow:0 0 0 4px ${a.c}22"></span><div><div style="font-size:14px">${esc(a.x)}</div><div class="sub" style="margin-top:3px">${esc(a.b)}</div></div><span class="mono sub">${ftime(a.at)}</span></div>`).join('') : '<div class="empty">Nothing yet.</div>'}</div>
<div class="card"><div class="ch"><h2>Health</h2><span class="sub" style="color:${bad ? C.dn : '#9FD9C0'}">${bad ? (HL.length - bad) + ' of ' + HL.length + ' OK' : 'all OK'}</span></div>
${HL.map(x => `<div class="hl"><span style="width:8px;height:8px;border-radius:50%;background:${x.c}"></span><span style="flex:1">${esc(x.k)}</span><span class="mono" style="font-size:13px;color:${C.mu}">${esc(x.v)}</span></div>`).join('')}</div></section>`;
  $('app').innerHTML = h;
}
load();
setInterval(() => { if (D) load(); }, 5 * 60 * 1000);
</script>
</body>
</html>
