    # ---- OHM Pro (/ohm-pro/) - backtest-passed setup only - 2026-11-23 -------
    location ^~ /ohm-pro/api/ {
        proxy_pass http://127.0.0.1:8011/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location = /ohm-pro { return 301 /ohm-pro/; }
    location ^~ /ohm-pro/ {
        try_files $uri $uri/ /ohm-pro/index.html;
        add_header Cache-Control "no-cache";
    }
